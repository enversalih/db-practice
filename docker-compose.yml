services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8090}:80"
    env_file:
      - .env
    environment:
      APP_NAME: "${APP_NAME:-Relasyon Laboratuvarı}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "http://localhost:${APP_PORT:-8090}"
      APP_KEY: "${APP_KEY}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-hospital_lab}"
      DB_USERNAME: "${DB_USERNAME:-hospital}"
      DB_PASSWORD: "${DB_PASSWORD:-hospital}"
      SESSION_DRIVER: "${SESSION_DRIVER:-cookie}"
      CACHE_STORE: "${CACHE_STORE:-array}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      DATASET_PROFILE: "${DATASET_PROFILE:-small}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-hospital_lab}"
      POSTGRES_USER: "${DB_USERNAME:-hospital}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-hospital}"
      TZ: "${APP_TIMEZONE:-Europe/Istanbul}"
    ports:
      - "${DB_EXPOSE_PORT:-54329}:5432"
    volumes:
      - hospital_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  hospital_pgdata:
